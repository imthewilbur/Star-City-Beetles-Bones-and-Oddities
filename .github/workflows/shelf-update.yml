name: Shelf update

# Triggered by the Make scenario when Tony submits the Tally form,
# or run by hand from the Actions tab with a JSON payload.
on:
  repository_dispatch:
    types: [shelf-submission]
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON, e.g. {"action":"sold","code":"...","item":"#3"}'
        required: true

concurrency:
  group: shelf-update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Apply submission
        id: apply
        env:
          PAYLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.payload || toJSON(github.event.client_payload) }}
          SHELF_CODE: ${{ secrets.SHELF_CODE }}
        run: python scripts/shelf_update.py

      - name: Commit and publish
        if: steps.apply.outputs.changed == 'true'
        env:
          MSG: ${{ steps.apply.outputs.message }}
        run: |
          git config user.name "shelf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shelf.json images/shelf
          git commit -m "$MSG"
          for i in 1 2 3; do git pull --rebase --quiet origin main && git push origin HEAD:main && break; sleep 5; done

      - name: Nudge GitHub Pages rebuild
        if: steps.apply.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent
